# Levantar desde la raíz del repositorio:
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  agente:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: agente-brokitech:latest
    container_name: agente-brokitech
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      AGENTE_TOP_K: ${AGENTE_TOP_K:-5}
      AGENTE_TEMPERATURA: ${AGENTE_TEMPERATURA:-0.2}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
